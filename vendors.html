<style>

:root{
--accent:#8d1831;
--accent-light:#fff2f5;
--bg:#ffffff;
--line:#e4e6e9;
--text:#111111;

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:"DM Sans",sans-serif;
background:#fff;

}

button,input,select{

button{

}

.container{

/* HEADER REMOVED */

/* HERO */

.hero{
padding:35px 0 27px;

180deg,
#fff7f9,
#ffffff

}

.hero-tag{

.hero h1{

.hero p{

}

.stats{

.stat strong{

.stat span{

/* SEARCH */

.category-btn{

.category-btn.active{

.vendor-grid{

<script>

const SUPABASE_URL =
"https://acgbtsfuwybbtzakvmjf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dAYxllrkoRGYtW4_jNCQrQ_rXksAiCB";

const sb=supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* ELEMENTS */

const vendorGrid=
document.getElementById("vendorGrid");

const searchInput=
document.getElementById("searchInput");

const categoryFilters=
document.getElementById("categoryFilters");

const listingTitle=
document.getElementById("listingTitle");

const resultCount=
document.getElementById("resultCount");

const sortSelect=
document.getElementById("sortSelect");

const businessCount=
document.getElementById("businessCount");


/* DATA */

let categories=[];

let subcategoriesData=[];

let vendors=[];

let vendorMappings=[];
let vendorMedia=[];
let sliderIntervals=[];

let activeCategory="all";

let searchTerm="";


/* ESCAPE */

function escapeHTML(value){

return String(value??"").replace(/[&<>"']/g,char=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[char]));

}


/* PHONE */

function phoneNumber(value){

return String(value||"")
.replace(/\D/g,"");

}


/* CATEGORY LOAD */

async function loadCategories(){

const {data,error}=await sb

.from("franchise_categories")

.select("*")

.eq("is_active",true)

.order("sort_order");

if(error){

console.error("Category error:",error);

return;

}

categories=data||[];

const categoryCountElement =
document.getElementById("categoryCount");

if(categoryCountElement){
  categoryCountElement.textContent=categories.length;
}

renderCategoryFilters();

}


/* FILTER BUTTONS */

function renderCategoryFilters(){

let html=`

<button
class="category-btn ${activeCategory==="all"?"active":""}"
data-category="all"
>
All Businesses
</button>

`;

categories.forEach(category=>{

html+=`

<button
class="category-btn ${activeCategory===category.id?"active":""}"
data-category="${category.id}"
>
${escapeHTML(category.name)}
</button>

`;

});

categoryFilters.innerHTML=html;


/* BUTTON EVENTS */

categoryFilters
.querySelectorAll(".category-btn")
.forEach(button=>{

button.addEventListener("click",function(){

activeCategory=this.dataset.category;

renderCategoryFilters();

renderVendors();

});

});

}


/* LOAD SUBCATEGORIES */

async function loadSubcategories(){

const {data,error}=await sb

.from("franchise_subcategories")

.select("*")

.eq("is_active",true)

.order("sort_order");

if(error){

console.error("Subcategory error:",error);

return;

}

subcategoriesData=data||[];

}


/* LOAD VENDOR MAPPINGS */

async function loadMappings(){

const {data,error}=await sb

.from("franchise_vendor_categories")

.select("*");

if(error){

console.error("Mapping error:",error);

vendorMappings=[];

return;

}

vendorMappings=data||[];

}


/* LOAD VENDORS */

async function loadVendors(){

const {data,error}=await sb

.from("franchise_vendors")

.select("*")

.eq("status","approved")

.order("created_at",{
ascending:false
});

if(error){

console.error("Vendor error:",error);

vendorGrid.innerHTML=`

<div class="empty-state">

<div class="emoji">⚠️</div>

<h3>Unable to load businesses</h3>

<p>${escapeHTML(error.message)}</p>

</div>

`;

return;

}

vendors=data||[];

  if(businessCount){
  businessCount.textContent=vendors.length;
  }

}


/* LOAD RECENT WORK MEDIA */
async function loadVendorMedia(){
  const ids=vendors.map(v=>v.id).filter(Boolean);
  vendorMedia=[];
  if(!ids.length) return;
  const {data,error}=await sb
    .from("franchise_vendor_media")
    .select("vendor_id,media_url,media_type,sort_order,title")
    .in("vendor_id",ids)
    .eq("media_type","image")
    .order("sort_order",{ascending:true});
  if(error){
    console.warn("Recent work media could not load:",error);
    return;
  }
  vendorMedia=data||[];
}
function getVendorPhotos(vendorId){
  return vendorMedia
    .filter(item=>item.vendor_id===vendorId && item.media_url)
    .sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))
    .map(item=>item.media_url);
}


/* SEARCH */

searchInput.addEventListener("input",function(){

searchTerm=this.value
.trim()
.toLowerCase();

renderVendors();

});


/* SORT */

sortSelect.addEventListener("change",function(){

renderVendors();

});


/* VENDOR MAPPING */

function getVendorMappings(vendorId){

return vendorMappings.filter(mapping=>
mapping.vendor_id===vendorId
);

}


/* GET CATEGORY NAMES */

function getVendorCategoryNames(vendorId){

const mappings=getVendorMappings(vendorId);

let names=[];

mappings.forEach(mapping=>{

const sub=subcategoriesData.find(
item=>item.id===mapping.subcategory_id
);

const cat=categories.find(
item=>item.id===mapping.category_id
);

if(sub){

names.push(sub.name);

}else if(cat){

names.push(cat.name);

}

});

return [...new Set(names)];

}


/* CATEGORY MATCH */

function vendorMatchesCategory(vendor,categoryId){

if(categoryId==="all"){

return true;

}

return getVendorMappings(vendor.id)
.some(mapping=>
mapping.category_id===categoryId
);

}


/* SEARCH MATCH */

function vendorMatchesSearch(vendor){

if(!searchTerm){

return true;

}

const categoryNames=
getVendorCategoryNames(vendor.id)
.join(" ");

const searchContent=[

vendor.business_name,

vendor.owner_name,

vendor.business_type,

vendor.description,

vendor.products_services,

vendor.phone,

vendor.whatsapp,

categoryNames

].join(" ").toLowerCase();

return searchContent.includes(searchTerm);

}


/* CATEGORY TITLE */

function getCategoryTitle(){

if(activeCategory==="all"){

return "All Businesses";

}

const category=categories.find(
item=>item.id===activeCategory
);

return category?.name||"Businesses";

}

/* RECENT WORK SLIDER HTML */
function recentWorkSliderHTML(photos,vendorId){
  if(!photos || !photos.length) return "";
  const safePhotos=photos.map(url=>escapeHTML(url));
  const slides=safePhotos.map((url,i)=>`
    <div class="project-slide">
      <img src="${url}" alt="Recent work photo ${i+1}" loading="lazy">
    </div>
  `).join("");
  const dots=safePhotos.map((_,i)=>`
    <button type="button" class="project-slider-dot ${i===0?"active":""}" aria-label="Show photo ${i+1}" data-slide="${i}"></button>
  `).join("");
  return `
    <div class="project-slider ${photos.length===1?"single":""}" data-vendor-slider="${escapeHTML(vendorId)}" onclick="event.stopPropagation()">
      <div class="project-slider-track">${slides}</div>
      ${photos.length>1?`
        <button type="button" class="project-slider-arrow project-slider-prev" aria-label="Previous photo">‹</button>
        <button type="button" class="project-slider-arrow project-slider-next" aria-label="Next photo">›</button>
        <div class="project-slider-dots">${dots}</div>
      `:""}
    </div>
  `;
}

/* INITIALIZE RECENT WORK SLIDERS */
function initRecentWorkSliders(){
  sliderIntervals.forEach(timer=>clearInterval(timer));
  sliderIntervals=[];
  document.querySelectorAll(".project-slider").forEach(slider=>{
    const track=slider.querySelector(".project-slider-track");
    const slides=slider.querySelectorAll(".project-slide");
    const dots=slider.querySelectorAll(".project-slider-dot");
    if(!track || slides.length<2) return;
    let index=0;
    const goTo=(next)=>{
      index=(next+slides.length)%slides.length;
      track.style.transform=`translateX(-${index*100}%)`;
      dots.forEach((dot,i)=>dot.classList.toggle("active",i===index));
    };
    slider.querySelector(".project-slider-prev")?.addEventListener("click",e=>{
      e.stopPropagation();goTo(index-1);
    });
    slider.querySelector(".project-slider-next")?.addEventListener("click",e=>{
      e.stopPropagation();goTo(index+1);
    });
    dots.forEach((dot,i)=>dot.addEventListener("click",e=>{
      e.stopPropagation();goTo(i);
    }));
    let startX=0;
    slider.addEventListener("touchstart",e=>{startX=e.touches[0].clientX;},{passive:true});
    slider.addEventListener("touchend",e=>{
      const delta=e.changedTouches[0].clientX-startX;
      if(Math.abs(delta)>40) goTo(index+(delta<0?1:-1));
    },{passive:true});
    const timer=setInterval(()=>goTo(index+1),3000);
    sliderIntervals.push(timer);
  });
}
