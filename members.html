      placeholder="Search business, member or city..."
      aria-label="Search members">

      </div>
    </div>

    <button class="modal-close" id="closeProfileModalBottom" type="button">Close Profile</button>
  </div>

<script>
const SUPABASE_URL = "https://acgbtsfuwybbtzakvmjf.supabase.co";
const SUPABASE_KEY = "sb_publishable_dAYxllrkoRGYtW4_jNCQrQ_rXksAiCB";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const memberList = document.getElementById("memberList");
const searchInput = document.getElementById("searchInput");
const categoryScroll = document.getElementById("categoryScroll");

let allMembers = [];
let activeCategory = "";

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

function safeWebURL(value) {
  try {
    const url = new URL(String(value || "").trim());
    if (url.protocol === "https:" || url.protocol === "http:") return url.href;
  } catch (error) {}
  return "";
}

function parseMemberDetails(member) {
  const lines = String(member.skills || "")
    .split(/\r?\n/)
    .map(line => line.trim())
    .filter(Boolean);

  const result = {
    city: "",
    category: "",
    subcategory: "",
    experience: "",
    services: []
  };

  lines.forEach(line => {
    const match = line.match(/^([^:]+)\s*:\s*(.*)$/);
    if (!match) {
      result.services.push(line);
      return;
    }

    const key = match[1].trim().toLowerCase();
    const value = match[2].trim();

    if (key === "city") result.city = value;
    else if (key === "business category") result.category = value;
    else if (key === "subcategory") result.subcategory = value;
    else if (key === "experience") result.experience = value;
    else result.services.push(line);
  });

  if (!result.experience) result.experience = member.experience_level || "";
  if (!result.city) result.city = member.city || "";
  if (!result.category) result.category = member.business_category || member.department || "";
  if (!result.subcategory) result.subcategory = member.business_subcategory || "";

  return result;
}
  function makeInitials(name) {
  return String(name || "Member")
    .trim()
    .split(/\s+/)
    .filter(Boolean)
    .slice(0, 2)
    .map(part => part[0])
    .join("")
    .toUpperCase();
}

function avatarPlaceholder(name) {
  const initials = escapeHTML(makeInitials(name));
  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">' +
    '<rect width="100" height="100" rx="50" fill="#393940"/>' +
    '<text x="50" y="57" text-anchor="middle" font-size="30" ' +
    'font-family="Arial" fill="#ffffff">' + initials + '</text></svg>';

  return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
}

function getMemberPhoto(member) {
  return safeWebURL(member.photo_url) || avatarPlaceholder(member.full_name);
}

/* All 29 categories from Join Member page */
const BUSINESS_CATEGORIES = [
  "Construction & Real Estate",
  "Electrical & Electronics",
  "AC, HVAC & Refrigeration",
  "Plumbing & Sanitary",
  "Manufacturing & Industrial",
  "Trading, Wholesale & Distribution",
  "IT & Software Technology",
  "Digital Marketing & Media",
  "Graphic Design & Creative",
  "Video, Photography & Production",
  "Sales & Business Development",
  "Finance, Accounts & Taxation",
  "Legal & Compliance",
  "HR & Recruitment",
  "Education & Training",
  "Food & Beverage",
  "Automobile & Transportation",
  "Logistics & Supply Chain",
  "Event Management & Entertainment",
  "Fashion, Clothing & Textile",
  "Beauty, Wellness & Personal Care",
  "Healthcare & Medical",
  "Cleaning & Facility Management",
  "Home & Lifestyle Services",
  "Security & Safety",
  "Professional & Consulting Services",
  "Freelancers & Independent Professionals",
  "Business Support & Marketing Services",
  "Other Businesses & Emerging Industries"
];

function populateCategories() {
  const memberCategories = allMembers
    .map(member => parseMemberDetails(member).category.trim())
    .filter(Boolean);

  const categories = [...new Set([
    ...BUSINESS_CATEGORIES,
    ...memberCategories
  ])];

  categoryScroll.innerHTML = "";

  const allButton = document.createElement("button");
  allButton.type = "button";
  allButton.className = "category-chip active";
  allButton.dataset.category = "";
  allButton.textContent = "All";
  categoryScroll.appendChild(allButton);

  categories.forEach(category => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "category-chip";
    button.dataset.category = category;
    button.textContent = category;
    categoryScroll.appendChild(button);
  });
}

function setActiveCategory(category) {
  activeCategory = category;

  categoryScroll.querySelectorAll(".category-chip").forEach(button => {
    button.classList.toggle("active", button.dataset.category === category);
  });

  renderMembers();
}

categoryScroll.addEventListener("click", event => {
  const button = event.target.closest(".category-chip");
  if (!button) return;
  setActiveCategory(button.dataset.category || "");
});

function flipCard(card) {
  card.classList.toggle("flipped");
  card.setAttribute(
    "aria-label",
    card.classList.contains("flipped")
      ? "Business details. Tap to see photo"
      : "Member photo. Tap to see business details"
  );
}

function getMemberLinks(member, details) {
  const candidates = [
    ["Website", member.website_url || member.website || member.portfolio_url],
    ["Instagram", member.instagram_url || member.instagram],
    ["LinkedIn", member.linkedin_url || member.linkedin],
    ["Play Store App", member.play_store_url || member.playstore_url || member.google_play_url],
    ["iOS App Store", member.app_store_url || member.ios_app_url || member.apple_app_store_url]
  ];

  return candidates.map(([label, value]) => ({
    label,
    url: safeWebURL(value)
  })).filter(item => item.url);
}

function openMemberProfile(member) {
  const details = parseMemberDetails(member);

  document.getElementById("profileModalPhoto").src = getMemberPhoto(member);
  document.getElementById("profileModalName").textContent = member.full_name || "BGC Member";
  document.getElementById("profileModalCategory").textContent =
    (details.category || "BGC CLUB Member") +
    (details.subcategory ? " · " + details.subcategory : "");

  const rows = [
    ["Business Location", details.city],
    ["Business Experience", details.experience],
    ["Products & Services", details.services.join(", ")]
  ].filter(row => row[1]);

  document.getElementById("profileModalDetails").innerHTML = rows.map(([label, value]) =>
    `<div class="back-detail"><strong>${escapeHTML(label)}</strong>${escapeHTML(value)}</div>`
  ).join("");

  const links = getMemberLinks(member, details);
  document.getElementById("profileModalLinks").innerHTML = links.length
    ? links.map(item =>
        `<a class="profile-link" href="${escapeHTML(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(item.label)} ↗</a>`
      ).join("")
    : '<div class="back-detail">இந்த member இன்னும் website / social / app links சேர்க்கவில்லை.</div>';

  document.getElementById("profileModal").classList.add("show");
  document.body.style.overflow = "hidden";
}

function closeMemberProfile() {
  document.getElementById("profileModal").classList.remove("show");
  document.body.style.overflow = "";
}

document.getElementById("closeProfileModal").addEventListener("click", closeMemberProfile);
document.getElementById("closeProfileModalBottom").addEventListener("click", closeMemberProfile);

document.getElementById("profileModal").addEventListener("click", event => {
  if (event.target.id === "profileModal") closeMemberProfile();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeMemberProfile();
});
  function renderMembers() {
  const term = searchInput.value.trim().toLowerCase();

  const filtered = allMembers.filter(member => {
    const details = parseMemberDetails(member);
    const searchable = [
      member.full_name,
      details.city,
      details.category,
      details.subcategory,
      details.experience,
      details.services.join(" "),
      member.department,
      member.work_type
    ].join(" ").toLowerCase();

    const matchesSearch = searchable.includes(term);
    const matchesCategory = !activeCategory || details.category === activeCategory;
    return matchesSearch && matchesCategory;
  });

  if (!filtered.length) {
    memberList.innerHTML =
      '<div class="message">No matching business members found.<br>Try another search or choose a different category.</div>';
    return;
  }

  memberList.innerHTML = filtered.map(member => {
    const details = parseMemberDetails(member);
    const photo = escapeHTML(getMemberPhoto(member));
    const portfolio = safeWebURL(member.portfolio_url);
    const category = details.category || "BGC CLUB Member";
    const subcategory = details.subcategory || "";

    const cityHTML = details.city
      ? `<div class="back-detail"><strong>Business Location</strong>${escapeHTML(details.city)}</div>` : "";

    const subHTML = subcategory
      ? `<div class="back-detail"><strong>Subcategory</strong>${escapeHTML(subcategory)}</div>` : "";

    const experienceHTML = details.experience
      ? `<div class="back-detail"><strong>Business Experience</strong>${escapeHTML(details.experience)}</div>` : "";

    const servicesHTML = details.services.length
      ? `<div class="back-detail"><strong>Products & Services</strong>${escapeHTML(details.services.join(", "))}</div>` : "";

    const portfolioHTML = portfolio
      ? `<div class="back-detail"><strong>Website / Portfolio</strong><a href="${escapeHTML(portfolio)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" style="color:#efa4b4;position:relative;z-index:10">Visit website ↗</a></div>` : "";

    const memberId = escapeHTML(member.id);

    return `
      <article class="flip-card"
        tabindex="0"
        role="button"
        aria-label="View ${escapeHTML(member.full_name)} business details"
        onclick="flipCard(this)"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flipCard(this)}">
        <div class="flip-inner">
          <div class="flip-front">
            <img class="front-photo"
              src="${photo}"
              alt="${escapeHTML(member.full_name || "Member")}"
              loading="lazy"
              onerror="this.onerror=null;this.src=avatarPlaceholder(this.alt)">
            <div class="front-shade"></div>
            <div class="front-content">
              <div class="front-name">${escapeHTML(member.full_name || "BGC Member")}</div>
              <div class="front-category">${escapeHTML(category)}${subcategory ? " · " + escapeHTML(subcategory) : ""}</div>
              <div class="flip-hint">↻ Tap to view business profile</div>
            </div>
          </div>
          <div class="flip-back">
            <div class="back-top">
              <img class="back-avatar" src="${photo}" alt="" loading="lazy">
              <div>
                <div class="back-name">${escapeHTML(member.full_name || "BGC Member")}</div>
                <div class="back-label">BGC CLUB Business Member</div>
              </div>
            </div>
            <div class="back-details">
              <div class="back-detail"><strong>Main Business Category</strong>${escapeHTML(category)}</div>
              ${subHTML}
              ${cityHTML}
              ${experienceHTML}
              ${servicesHTML}
              ${portfolioHTML}
            </div>
            <div class="back-actions">
              <button class="back-btn" type="button"
                onclick="event.stopPropagation();openMemberProfile(allMembers.find(item => String(item.id) === String('${memberId}')) || {})">
                ↗ View Profile
              </button>
            </div>
          </div>
        </div>
      </article>
    `;
  }).join("");
}

async function loadMembers() {
  memberList.innerHTML = '<div class="message">Loading approved members...</div>';

  try {
    const { data, error } = await db
      .from("bgc_team_members")
      .select("*")
      .eq("status", "approved")
      .order("full_name", { ascending: true });

    if (error) throw error;

    allMembers = data || [];
    populateCategories();
    renderMembers();

  } catch (error) {
    console.error("Could not load BGC CLUB members:", error);
    memberList.innerHTML =
      '<div class="message">Members list load ஆகவில்லை.<br>' +
      'Supabase connection மற்றும் table permissions-ஐச் சரிபார்க்கவும்.' +
      '<br><button class="retry" onclick="loadMembers()">Try Again</button></div>';
  }
}

searchInput.addEventListener("input", renderMembers);
populateCategories();
loadMembers();
</script>
