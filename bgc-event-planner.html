  /* PROVIDERS - VERTICAL GRID LAYOUT */

.provider-track {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    width: 100%;
    padding: 5px 14px 20px;

    overflow: visible;
    overflow-x: visible;
    overflow-y: visible;

    scroll-snap-type: none;
}

.provider-track[hidden] {
    display: none !important;
}

.provider-card {
    width: 100%;
    min-width: 0;
    max-width: none;
    flex: initial;
    scroll-snap-align: none;
    border-radius: 17px;
}

.provider-photo {
    width: 100%;

.provider-name {

    width: 100%;
    min-height: 36px;
    font-size: 10px;
}

@media (min-width: 700px) {
    .provider-track {
        grid-template-columns: repeat(3, minmax(0, 1fr));

        padding-left: 18px;
        padding-right: 18px;

    object-position: center;
    display: block;

.provider-card:hover .provider-photo img {
    transform: scale(1.045);
}

.provider-photo::after {
    content: "";
    position: absolute;
    inset: 35% 0 0;
    background: linear-gradient(
        to bottom,
        transparent,
        rgba(0,0,0,.38)

@media (min-width: 700px) {

  /* PROVIDER PHOTO DISPLAY FIX */

.provider-photo {

    height: 190px;

    overflow: hidden;

.provider-photo img {

    object-position: center 28%;

    transition: transform .35s ease;

/* Avoid unwanted zoom */
.provider-card:hover .provider-photo img {

/* Tablet and Desktop */

};

const eventItems = [
 {name:"All",emoji:"✦"},
 {name:"Marriage",emoji:"💍"},
 {name:"Birthday",emoji:"🎂"},
 {name:"Engagement",emoji:"💐"},
 {name:"Puberty Function",emoji:"🎉"},
 {name:"Surprise Events",emoji:"🎁"}
];const SUPABASE_URL = "https://acgbtsfuwybbtzakvmjf.supabase.co";
const SUPABASE_KEY = "sb_publishable_dAYxllrkoRGYtW4_jNCQrQ_rXksAiCB";

const eventTrack = document.getElementById("eventTrack");
const providerTrack = document.getElementById("providerTrack");
const statusEl = document.getElementById("status");
const emptyEl = document.getElementById("empty");
const subtitleEl = document.getElementById("providerSubtitle");
const viewAllEl = document.getElementById("viewAll");
const searchInput = document.getElementById("providerSearch");

let selectedEvent = "All";
let allProviders = [];

function normalize(value){
 return String(value || "")
  .trim().toLowerCase()
  .replace(/&/g,"and")
  .replace(/\s+/g," ");
}

function canonicalCategory(value){
 const key=normalize(value);
 const aliases={
  "marriage hall / venue":"event hall / venue",
  "birthday hall / venue":"event hall / venue",
  "engagement venue":"event hall / venue",
  "function hall / venue":"event hall / venue",
  "event hall":"event hall / venue",
  "venue":"event hall / venue",
  "bridal makeup":"makeup",
  "makeup artist":"makeup",
  "wedding dress":"dress",
  "saree / dress":"dress",
  "birthday cake":"cake",
  "cake / sweets":"cake",
  "flowers / bouquet":"flower decoration",
  "birthday decoration":"decoration",
  "surprise decoration":"decoration",
  "invitation":"invitation printing",
  "music / dj":"dj / music",
  "stage decoration":"stage setup"
 };
 return aliases[key] || key;
}

function storedService(value){
 if(Array.isArray(value))return value.join(", ");
 const stored=String(value || "").trim();
 if(!stored)return "";

 const parts=stored.split(/\s*[—–]\s*/);
 return parts.length>=2
  ?parts.slice(1).join(" — ").trim()
  :stored;
}

function getEventCategories(eventName){
 return (serviceData[eventName] || []).map(item=>({
  label:item[1],
  slug:item[2],
  emoji:item[0],
  canonical:canonicalCategory(item[1])
 }));
}

function providerCategory(provider){
 return storedService(
  provider.event_category ??
  provider.service_category ??
  provider.category ??
  ""
 );
}

function matchesEvent(provider,eventName){
 if(eventName==="All")return true;

 const cat=canonicalCategory(providerCategory(provider));
 if(!cat)return false;

 return getEventCategories(eventName).some(
  item=>item.canonical===cat
 );
}

function escapeHtml(value){
 return String(value ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function cleanPhone(value){
 return String(value || "").replace(/\D/g,"");
}

function getWhatsApp(value){
 let number=cleanPhone(value);
 if(number.length===10)number="91"+number;
 return number;
}

function providerUrl(provider){
 const category=providerCategory(provider) || "";
 const item=getEventCategories(selectedEvent).find(
  x=>x.canonical===canonicalCategory(category)
 );

 const label=item ? item.label : category;
 const slug=item ? item.slug : category;
 const eventParam=selectedEvent==="All" ? "Marriage" : selectedEvent;

 return "bgc-event-providers.html?event="+encodeURIComponent(eventParam)
  +"&category="+encodeURIComponent(slug)
  +"&label="+encodeURIComponent(label);
}

function makeEventButtons(){
 eventTrack.innerHTML="";

 eventItems.forEach(item=>{
  const button=document.createElement("button");
  button.type="button";
  button.className="event-card"+(
   item.name===selectedEvent ? " active" : ""
  );
  button.setAttribute("aria-pressed",String(item.name===selectedEvent));
  button.textContent=item.name;

  button.addEventListener("click",()=>{
   selectedEvent=item.name;
   makeEventButtons();
   renderProviders();
  });

  eventTrack.appendChild(button);
 });
}

function firstValue(provider,keys){
 for(const key of keys){
  const value=provider[key];
  if(value!==undefined && value!==null && String(value).trim()!==""){
   return value;
  }
 }
 return "";
}

function createProviderCard(provider){

 const businessName=firstValue(provider,[
  "company_name","business_name","name","owner_name"
 ]) || "Event Service Provider";

 const category=providerCategory(provider) || "Event Service";

 const city=firstValue(provider,[
  "city","area","location"
 ]) || "Location not provided";

 const imageUrl=firstValue(provider,[
  "image_url","profile_image","business_image","photo_url","logo_url"
 ]);

 const phone=getWhatsApp(firstValue(provider,[
  "whatsapp","whatsapp_number","phone","mobile","mobile_number"
 ]));

 const url=providerUrl(provider);

 const card=document.createElement("article");
 card.className="provider-card";

 const photo=imageUrl
  ?'<img src="'+escapeHtml(imageUrl)+'" alt="'+escapeHtml(businessName)+'" loading="lazy" referrerpolicy="no-referrer">'
  :'<div class="photo-placeholder" aria-hidden="true">✦</div>';

 card.innerHTML=
  '<div class="provider-photo">'+photo+
   '<span class="category-chip">'+escapeHtml(category)+'</span>'+
  '</div>'+
  '<div class="provider-body">'+
   '<div class="provider-name">'+escapeHtml(businessName)+'</div>'+
   '<div class="provider-company">Registered service provider</div>'+
   '<div class="provider-city"><span>●</span><span>'+
    escapeHtml(city)+'</span></div>'+
   '<div class="provider-actions">'+
    (phone
     ?'<a class="action whatsapp" href="https://wa.me/'+
       escapeHtml(phone)+'" target="_blank" rel="noopener noreferrer">WhatsApp</a>'
     :''
    )+
   '<div class="provider-actions">'+
 (phone
  ?'<a class="action call" href="tel:+'
    +escapeHtml(phone)+'">☎ Call Now</a>'
  :'')
 const img=card.querySelector("img");

 if(img){
  img.addEventListener("error",()=>{
   const box=img.parentElement;
   img.remove();

   const fallback=document.createElement("div");
   fallback.className="photo-placeholder";
   fallback.textContent="✦";
   box.prepend(fallback);
  });
 }

 return card;
}

function renderProviders(){

 const query=normalize(searchInput.value);

 const matched=allProviders.filter(provider=>{

  if(!matchesEvent(provider,selectedEvent))return false;
  if(!query)return true;

  return normalize([
   provider.name,
   provider.company_name,
   provider.business_name,
   provider.event_category,
   provider.city,
   provider.category
  ].join(" ")).includes(query);
 });

 providerTrack.innerHTML="";
 emptyEl.hidden=true;
 providerTrack.hidden=true;
 statusEl.hidden=false;

 subtitleEl.textContent=selectedEvent==="All"
  ?"Explore trusted event professionals"
  :"Showing providers for "+selectedEvent;

 const first=matched[0];

 if(first){
  viewAllEl.href=providerUrl(first);
 }else{
  viewAllEl.href="bgc-event-providers.html";
 }

 if(!matched.length){
  statusEl.hidden=true;
  emptyEl.textContent=query
   ?"No providers match your search."
   :"No registered providers found for "+selectedEvent+" yet.";
  emptyEl.hidden=false;
  return;
 }

 matched.forEach(provider=>{
  providerTrack.appendChild(createProviderCard(provider));
 });

 statusEl.hidden=true;
 providerTrack.hidden=false;
}

searchInput.addEventListener("input",renderProviders);/* SUPABASE PROVIDER LOADING */
async function loadProviders(){

 statusEl.hidden=false;
 emptyEl.hidden=true;
 providerTrack.hidden=true;
 statusEl.textContent="Loading registered providers...";

 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),15000);

 try{

  /*
   * IMPORTANT:
   * select=* avoids failure caused by an incorrect column list.
   * No order clause, so missing company_name column won't break the request.
   */
  const url=SUPABASE_URL+
   "/rest/v1/bgc_eventers?select=*";

  const response=await fetch(url,{
   method:"GET",
   headers:{
    apikey:SUPABASE_KEY,
    Authorization:"Bearer "+SUPABASE_KEY,
    Accept:"application/json"
   },
   signal:controller.signal
  });

  const responseText=await response.text();

  if(!response.ok){
   let errorMessage=responseText;

   try{
    const errorData=JSON.parse(responseText);
    errorMessage=errorData.message ||
     errorData.details ||
     errorData.hint ||
     responseText;
   }catch(e){}

   throw new Error(
    "Supabase HTTP "+response.status+": "+errorMessage
   );
  }

  let data;

  try{
   data=JSON.parse(responseText);
  }catch(e){
   throw new Error("Supabase returned invalid JSON data.");
  }

  if(!Array.isArray(data)){
   throw new Error("Supabase response is not a provider list.");
  }

  allProviders=data;

  console.log("BGC EVENTS: Provider records loaded:",data.length);
  console.log("BGC EVENTS: Provider sample:",data[0] || "No records");

  if(data.length===0){
   statusEl.hidden=true;
   providerTrack.hidden=true;
   emptyEl.hidden=false;
   emptyEl.textContent=
    "No provider records returned from bgc_eventers. Check table data and Row Level Security (RLS).";
   return;
  }

  renderProviders();

 }catch(error){

  console.error("BGC EVENTS Supabase error:",error);

  statusEl.hidden=true;
  providerTrack.hidden=true;
  emptyEl.hidden=false;
  emptyEl.classList.add("error");

  if(error.name==="AbortError"){
   emptyEl.textContent=
    "Request timed out. Supabase did not respond within 15 seconds.";
  }else if(
   error instanceof TypeError
  ){
   emptyEl.textContent=
    "Network or CORS error. Check the Supabase URL, connection and browser console.";
  }else{
   emptyEl.textContent=error.message ||
    "Unable to load providers. Please check Supabase settings.";
  }

 }finally{
  clearTimeout(timeout);
 }
}

/* BACK BUTTON */
document.getElementById("backButton").addEventListener("click",()=>{
 if(window.history.length>1){
  window.history.back();
 }else{
  window.location.href="index.html";
 }
});

/* HIDDEN ADMIN ACCESS: TAP BGC EVENTS 5 TIMES */
(function(){

 const title=document.getElementById("adminTap");
 if(!title)return;

 let taps=0;
 let timer=null;

 title.addEventListener("click",()=>{

  taps++;
  clearTimeout(timer);

  timer=setTimeout(()=>{
   taps=0;
  },3000);

  if(taps>=5){
   taps=0;
   clearTimeout(timer);
   window.location.href="admin-events.html";
  }

 });

})();

/* INITIAL PAGE LOAD */
makeEventButtons();
loadProviders();

</script>
