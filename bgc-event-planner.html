let selectedEvent = "Marriage";
let allProviders = [];
function normalize(value){return String(value||"").trim().toLowerCase().replace(/&/g,"and").replace(/\s+/g," ");}
function canonicalCategory(value){
 const key=normalize(value);
 const aliases={
  "marriage hall / venue":"event hall / venue","birthday hall / venue":"event hall / venue","engagement venue":"event hall / venue","function hall / venue":"event hall / venue","event hall":"event hall / venue","venue":"event hall / venue",

   
  "bridal makeup":"makeup","makeup artist":"makeup","wedding dress":"dress","saree / dress":"dress","birthday cake":"cake","cake / sweets":"cake","flowers / bouquet":"flower decoration","birthday decoration":"decoration","surprise decoration":"decoration","invitation":"invitation printing","music / dj":"dj / music","stage decoration":"stage setup"
 };
 return aliases[key]||key;
}
function storedService(value){
 const stored=String(value||"").trim();
 if(!stored)return "";
 const parts=stored.split(/\s*[—–-]\s*/);
 return parts.length>=2?parts.slice(1).join(" — ").trim():stored;
}
function getEventCategories(eventName){return (serviceData[eventName]||[]).map(item=>({label:item[1],slug:item[2],emoji:item[0],canonical:canonicalCategory(item[1])}));}
function providerCategory(provider){return storedService(provider.event_category);}
function matchesEvent(provider,eventName){
 const cat=canonicalCategory(providerCategory(provider));
 if(!cat)return false;
 return getEventCategories(eventName).some(item=>item.canonical===cat);
}
function escapeHtml(value){return String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function cleanPhone(value){return String(value||"").replace(/\D/g,"");}
function getWhatsApp(value){let number=cleanPhone(value);if(number.length===10)number="91"+number;return number;}
function providerUrl(provider){
 const category=providerCategory(provider)||"";
 const item=getEventCategories(selectedEvent).find(x=>x.canonical===canonicalCategory(category));
 const label=item?item.label:category;
 const slug=item?item.slug:category;
 return "bgc-event-providers.html?event="+encodeURIComponent(selectedEvent)+"&category="+encodeURIComponent(slug)+"&label="+encodeURIComponent(label);
}
function makeEventButtons(){
 eventTrack.innerHTML="";
 eventItems.forEach(item=>{
  const button=document.createElement("button");
  button.type="button";button.className="event-card"+(item.name===selectedEvent?" active":"");
  button.setAttribute("aria-pressed",String(item.name===selectedEvent));
  button.innerHTML='<span class="emoji" aria-hidden="true">'+item.emoji+'</span><span class="event-label">'+escapeHtml(item.name)+'</span>';
  button.addEventListener("click",()=>{selectedEvent=item.name;makeEventButtons();renderProviders();});
  eventTrack.appendChild(button);
 });
}
function createProviderCard(provider){
 const businessName=provider.company_name||provider.name||"Event Service Provider";
 const category=providerCategory(provider)||"Event Service";
 const city=String(provider.city||"").trim()||"Location not provided";
 const imageUrl=String(provider.image_url||"").trim();
 const phone=getWhatsApp(provider.whatsapp||provider.phone);
 const url=providerUrl(provider);
 const card=document.createElement("article");card.className="provider-card";
 const photo=imageUrl?'<img src="'+escapeHtml(imageUrl)+'" alt="'+escapeHtml(businessName)+'" loading="lazy" referrerpolicy="no-referrer">':'<div class="photo-placeholder" aria-hidden="true">🏢</div>';
 card.innerHTML='<div class="provider-photo">'+photo+'<span class="category-chip">'+escapeHtml(category)+'</span></div><div class="provider-body"><div class="provider-name">'+escapeHtml(businessName)+'</div><div class="provider-company">Registered service provider</div><div class="provider-city"><span aria-hidden="true">📍</span><span>'+escapeHtml(city)+'</span></div><div class="provider-actions">'+(phone?'<a class="action whatsapp" href="https://wa.me/'+escapeHtml(phone)+'" target="_blank" rel="noopener noreferrer">WhatsApp</a>':'')+'<a class="action view" href="'+escapeHtml(url)+'">View</a></div></div>';
 const img=card.querySelector("img");if(img)img.addEventListener("error",()=>{const box=img.parentElement;img.remove();const fallback=document.createElement("div");fallback.className="photo-placeholder";fallback.textContent="🏢";box.prepend(fallback);});
 return card;
}
function renderProviders(){
 const matched=allProviders.filter(provider=>matchesEvent(provider,selectedEvent));
 providerTrack.innerHTML="";emptyEl.hidden=true;providerTrack.hidden=true;statusEl.hidden=false;
 subtitleEl.textContent="Discover professionals for "+selectedEvent;
 const first=matched[0];
 if(first){viewAllEl.href=providerUrl(first);}else{
  const firstCategory=getEventCategories(selectedEvent)[0];
  viewAllEl.href=firstCategory?"bgc-event-providers.html?event="+encodeURIComponent(selectedEvent)+"&category="+encodeURIComponent(firstCategory.slug)+"&label="+encodeURIComponent(firstCategory.label):"bgc-event-providers.html?event="+encodeURIComponent(selectedEvent);
 }
 if(!matched.length){statusEl.hidden=true;emptyEl.textContent="No registered providers found for "+selectedEvent+" yet.";emptyEl.hidden=false;return;}
 matched.forEach(provider=>providerTrack.appendChild(createProviderCard(provider)));
 statusEl.hidden=true;providerTrack.hidden=false;
}
async function loadProviders(){
 statusEl.textContent="Loading registered providers...";
 try{
  const url=SUPABASE_URL+"/rest/v1/bgc_eventers?select=id,name,company_name,phone,whatsapp,event_category,instagram,image_url,city,website&order=company_name.asc.nullslast,name.asc";
  const response=await fetch(url,{method:"GET",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"}});
  if(!response.ok){const detail=await response.text();throw new Error("Supabase "+response.status+": "+detail);}
  const data=await response.json();if(!Array.isArray(data))throw new Error("Unexpected provider data returned from Supabase.");
  allProviders=data;renderProviders();
 }catch(error){

  statusEl.hidden=true;providerTrack.hidden=true;emptyEl.hidden=false;emptyEl.classList.add("error");emptyEl.textContent="Unable to load registered providers. Please check your connection and Supabase permissions.";
 }
}

<script>
(function () {
  const logo = document.querySelector(".brand-mark");
  if (!logo) return;

  let tapCount = 0;
  let resetTimer = null;

  logo.addEventListener("click", function (event) {
    event.preventDefault();
    tapCount++;

    clearTimeout(resetTimer);

    resetTimer = setTimeout(function () {
      tapCount = 0;
    }, 3000);

    if (tapCount >= 5) {
      tapCount = 0;
      clearTimeout(resetTimer);
      window.location.href = "admin-events.html";
    }
  });
})();
</script>
