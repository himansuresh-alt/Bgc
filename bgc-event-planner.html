<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111113">
<title>BGC EVENTS — Event Services</title>

<style>
:root{
 --bg:#111113;
 --surface:#1c1c20;
 --surface2:#242328;
 --ink:#f7f5f7;
 --muted:#aaa7af;
 --line:#3b3940;
 --accent:#a51d45;
 --accent2:#d65a7d;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--bg)}
body{
 font-family:Arial,Helvetica,sans-serif;
 background:radial-gradient(ellipse at 50% -15%,#292026 0,transparent 48%),var(--bg);
 color:var(--ink);line-height:1.5;min-height:100vh;
 padding:0 0 calc(94px + env(safe-area-inset-bottom,0px));
}
button,input,a{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.page{width:100%;max-width:1100px;margin:0 auto;padding:30px 0 35px}
.hero{text-align:center;padding:12px 18px 22px}
.hero-brand{
 display:inline-block;color:#d56a8b;font-size:12px;
 font-weight:900;letter-spacing:5px;margin-bottom:24px;
 user-select:none;cursor:pointer
}
.hero h1{
 max-width:760px;margin:auto;font-size:clamp(32px,6vw,48px);
 line-height:1.12;letter-spacing:-1.3px;font-weight:850
}
.hero h1 span{color:var(--accent2)}
.hero p{margin:16px auto 0;color:var(--muted);font-size:15px}
.search-wrap{padding:0 18px;margin:24px auto 22px;max-width:920px}
.search-inner{position:relative}
.search-icon{
 position:absolute;left:20px;top:50%;transform:translateY(-50%);
 font-size:21px;color:var(--muted);pointer-events:none
}
.search-box{
 width:100%;height:58px;border:1px solid #4a484f;border-radius:19px;
 background:linear-gradient(145deg,#242328,#1b1b1f);
 color:var(--ink);padding:0 18px 0 53px;font-size:14px;outline:none
}
.search-box::placeholder{color:#9c99a1}
.search-box:focus{border-color:var(--accent);box-shadow:0 0 0 3px #a51d4525}
.section{margin:27px 0 34px}
.event-track{
 display:flex;gap:10px;overflow-x:auto;padding:2px 18px 12px;
 scrollbar-width:none;-webkit-overflow-scrolling:touch
}
.event-track::-webkit-scrollbar{display:none}

/* SERVICE CATEGORY FILTER PILLS */
.event-track{
 display:flex;
 gap:10px;
 overflow-x:auto;
 padding:4px 18px 14px;
 scroll-snap-type:x proximity;
}
.event-card{scroll-snap-align:start;}
.event-card:focus-visible{outline:2px solid var(--accent2);outline-offset:3px;}

.event-card{
 flex:0 0 auto;min-height:50px;padding:0 19px;
 border:1px solid #414047;border-radius:999px;
 background:linear-gradient(145deg,#242328,#1c1c20);
 color:#e6e4e7;font-size:12px;font-weight:750;white-space:nowrap;
 transition:.18s
}
.event-card.active{
 background:linear-gradient(135deg,#b21f4c,#871432);
 border-color:#bd3159;color:#fff;box-shadow:0 5px 16px #a51d4533
}
.provider-head{
 display:flex;align-items:flex-end;justify-content:space-between;
 gap:12px;padding:0 18px;margin-bottom:14px
}
.provider-head h2{font-size:22px;line-height:1.2;font-weight:850}
.provider-head p{font-size:12px;color:var(--muted);margin-top:5px}
.view-all{color:#df7190;font-size:12px;font-weight:800;white-space:nowrap}
.provider-track{
 display:flex;gap:13px;overflow-x:auto;padding:2px 18px 14px;
 scrollbar-width:none;-webkit-overflow-scrolling:touch
}
.provider-track::-webkit-scrollbar{display:none}
.provider-card{
 flex:0 0 245px;width:245px;overflow:hidden;
 border:1px solid #3c3a41;border-radius:21px;
 background:linear-gradient(145deg,#202024,#17171a);
 box-shadow:0 9px 24px #0003
}
.provider-photo{height:165px;position:relative;overflow:hidden;background:#28252a}
.provider-photo img{width:100%;height:100%;display:block;object-fit:cover}
.photo-placeholder{
 height:100%;display:grid;place-items:center;color:#c6a6b1;
 font-size:42px;background:linear-gradient(145deg,#30252b,#1c1c20)
}
.category-chip{
 position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);
 padding:6px 10px;border-radius:999px;background:#a51d45ed;
 color:#fff;font-size:10px;font-weight:800;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis
}
.provider-body{padding:13px}
.provider-name{font-size:15px;line-height:1.3;font-weight:850;overflow-wrap:anywhere;min-height:38px}
.provider-company{font-size:11px;color:#b7b3bb;margin-top:4px;overflow-wrap:anywhere}
.provider-city{display:flex;gap:6px;font-size:11px;color:#b9b6be;margin-top:10px;overflow-wrap:anywhere}
.provider-actions{display:flex;gap:8px;margin-top:13px}
.action{
 min-height:38px;flex:1;display:flex;align-items:center;justify-content:center;
 text-align:center;border-radius:12px;padding:7px 8px;
 font-size:11px;font-weight:850;border:1px solid #55515a
}
.action.whatsapp{background:#172a21;border-color:#28543b;color:#8be0ad}
.action.view{background:#252126;border-color:#76505d;color:#f1a0b8}
.status,.empty{
 margin:0 18px;padding:22px 16px;border:1px solid #3c3a41;
 border-radius:17px;background:#1b1b1f;text-align:center;
 color:var(--muted);font-size:13px;overflow-wrap:anywhere
}
.error{color:#ff9b9b;border-color:#74414a}
.back-bar{
 position:fixed;left:18px;right:18px;
 bottom:calc(12px + env(safe-area-inset-bottom,0px));
 z-index:9999;max-width:560px;margin:0 auto
}
.back-button{
 width:100%;min-height:60px;display:flex;align-items:center;
 justify-content:center;gap:13px;border:1px solid #57545c;
 border-radius:999px;background:linear-gradient(145deg,#26262a,#1a1a1e);
 color:#f5f4f5;font-size:16px;font-weight:850;
 box-shadow:0 8px 24px #0007,inset 0 1px 1px #ffffff12
}
.back-button .arrow{font-size:25px;color:#e36d8e}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
 overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(min-width:700px){
 .page{padding-top:42px}
 .provider-card{flex-basis:270px;width:270px}
 .provider-photo{height:185px}
}
@media(max-width:480px){
 .page{padding-top:24px}
 .hero h1{font-size:34px}
 .hero p{font-size:14px}
 .provider-card{flex-basis:235px;width:235px}
 .provider-photo{height:155px}
 .back-bar{left:14px;right:14px}
}

/* PROVIDERS - VERTICAL GRID LAYOUT */
.provider-track {
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:14px;
 width:100%;
 padding:5px 14px 20px;
 overflow:visible;
 overflow-x:visible;
 overflow-y:visible;
 scroll-snap-type:none;
}
.provider-track[hidden] {
 display:none !important;
}
.provider-card {
 width:100%;
 min-width:0;
 max-width:none;
 flex:initial;
 scroll-snap-align:none;
 border-radius:17px;
}
.provider-photo {
 width:100%;
 height:155px;
}
.provider-body {
 padding:11px;
}
.provider-name {
 font-size:14px;
 min-height:38px;
 overflow-wrap:anywhere;
}
.provider-company {
 font-size:10px;
}
.provider-city {
 font-size:10px;
}
.provider-actions {
 display:flex;
 flex-direction:column;
 gap:7px;
}
.provider-actions .action {
 width:100%;
 min-height:36px;
 font-size:10px;
}

  @media (min-width:700px) {
 .provider-track {
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:18px;
  padding-left:18px;
  padding-right:18px;
 }
 .provider-photo {
  height:190px;
 }
 .provider-actions {
  flex-direction:row;
 }
}

/* PREMIUM LARGE PROVIDER PHOTOS */
.provider-photo {
 position:relative;
 width:100%;
 height:210px;
 overflow:hidden;
 background:#242126;
}
.provider-photo img {
 width:100%;
 height:100%;
 object-fit:cover;
 object-position:center;
 display:block;
 transition:transform .5s ease;
}
.provider-card:hover .provider-photo img {
 transform:scale(1.045);
}
.provider-photo::after {
 content:"";
 position:absolute;
 inset:35% 0 0;
 background:linear-gradient(
  to bottom,
  transparent,
  rgba(0,0,0,.38)
 );
 pointer-events:none;
}
.category-chip {
 z-index:2;
 bottom:12px;
 left:12px;
 padding:8px 13px;
 border-radius:30px;
 font-size:11px;
 box-shadow:0 4px 12px rgba(0,0,0,.25);
}
@media (max-width:480px) {
 .provider-photo {
  height:190px;
 }
}
@media (min-width:700px) {
 .provider-photo {
  height:245px;
 }
}

/* PROVIDER PHOTO DISPLAY FIX */
.provider-photo {
 width:100%;
 height:190px;
 position:relative;
 overflow:hidden;
 background:#242126;
 border-radius:16px 16px 0 0;
}
.provider-photo img {
 display:block;
 width:100%;
 height:100%;
 object-fit:cover;
 object-position:center 28%;
 border:0;
 transition:transform .35s ease;
}
.provider-card:hover .provider-photo img {
 transform:scale(1.02);
}
@media(max-width:480px) {
 .provider-photo {
  height:175px;
 }
}
@media(min-width:700px) {
 .provider-photo {
  height:240px;
 }
}
</style>
</head>

<body>
<main class="page">

 <section class="hero">
  <div class="hero-brand" id="adminTap">BGC EVENTS</div>
  <h1>Find the Best<br><span>Event Service Providers</span></h1>
  <p>Discover trusted professionals by service category.</p>
 </section>

 <div class="search-wrap">
  <div class="search-inner">
   <span class="search-icon" aria-hidden="true">⌕</span>
   <label class="sr-only" for="providerSearch">Search providers</label>
   <input id="providerSearch" class="search-box" type="search"
    placeholder="Search event service or city..." autocomplete="off">
  </div>
 </div>

 <section class="section" id="eventsSection">
  <div class="event-track" id="eventTrack"
   aria-label="Filter providers by service category"></div>
 </section>

 <section class="section" id="providersSection">
  <div class="provider-head">
   <div>
    <h2 id="providerHeading">Registered Providers</h2>
    <p id="providerSubtitle">Discover professionals for your event</p>
   </div>
   <a class="view-all" id="viewAll"
    href="bgc-event-providers.html">View all →</a>
  </div>

  <div id="status" class="status" role="status">
   Loading registered providers...
  </div>

  <div class="provider-track" id="providerTrack"
   aria-label="Registered service providers" hidden></div>

  <div id="empty" class="empty" hidden></div>
 </section>

</main>

<div class="back-bar">
 <button type="button" class="back-button" id="backButton">
  <span class="arrow" aria-hidden="true"></span>
  <span>Back</span>
 </button>
</div>

<script>
"use strict";

const BGC_EVENT_CATEGORIES = [
  ["📋", "Event Planner & Management", "event-planner-management"],
  ["🏛️", "Event Hall & Venue", "event-hall-venue"],
  ["🍽️", "Catering", "catering"],
  ["📸", "Photography", "photography"],
  ["🎥", "Videography", "videography"],
  ["🎨", "Decoration", "decoration"],
  ["🎤", "Stage & Backdrop Setup", "stage-backdrop-setup"],
  ["🎵", "DJ & Music", "dj-music"],
  ["💡", "Audio & Lighting", "audio-lighting"],
  ["💃", "Choreography", "choreography"],
  ["💄", "Makeup & Hairstyling", "makeup-hairstyling"],
  ["🌿", "Mehendi", "mehendi"],
  ["💍", "Wedding Wear & Jewellery", "wedding-wear-jewellery"],
  ["🎭", "Entertainment & Performers", "entertainment-performers"],
  ["🧸", "Kids Entertainment & Toys", "kids-entertainment-toys"],
  ["🍰", "Cake & Desserts", "cake-desserts"],
  ["💌", "Invitation & Printing", "invitation-printing"],
  ["🎁", "Gifts & Return Gifts", "gifts-return-gifts"],
  ["🚗", "Wedding Transport", "wedding-transport"],
  ["🛠️", "Event Rentals & Equipment", "event-rentals-equipment"]
];

const eventItems = [
 {name:"All", emoji:"✦"},
 ...BGC_EVENT_CATEGORIES.map(item => ({
  name:item[1],
  emoji:item[0]
 }))
];

const SUPABASE_URL = "https://acgbtsfuwybbtzakvmjf.supabase.co";
const SUPABASE_KEY = "sb_publishable_dAYxllrkoRGYtW4_jNCQrQ_rXksAiCB";

const eventTrack = document.getElementById("eventTrack");
const providerTrack = document.getElementById("providerTrack");
const statusEl = document.getElementById("status");
const emptyEl = document.getElementById("empty");
const subtitleEl = document.getElementById("providerSubtitle");
const viewAllEl = document.getElementById("viewAll");
const searchInput = document.getElementById("providerSearch");

let selectedEvent = "All";
let allProviders = [];

  function normalize(value){
 return String(value || "")
  .trim().toLowerCase()
  .replace(/&/g,"and")
  .replace(/\s+/g," ");
}

function canonicalCategory(value){
    const key = normalize(value);

    const aliases = {
        // Event Planner & Management
        "event planner": "event planner and management",
        "traditional services": "event planner and management",
        "traditional function services": "event planner and management",
        "combo pack": "event planner and management",

        // Event Hall & Venue
        "event hall / venue": "event hall and venue",
        "event hall": "event hall and venue",
        "venue": "event hall and venue",
        "marriage hall / venue": "event hall and venue",
        "birthday hall / venue": "event hall and venue",
        "engagement venue": "event hall and venue",
        "function hall / venue": "event hall and venue",
        "restaurant / private dining": "event hall and venue",

        // Decoration
        "flower decoration": "decoration",
        "balloon decoration": "decoration",
        "birthday decoration": "decoration",
        "surprise decoration": "decoration",
        "room decoration": "decoration",
        "proposal setup": "decoration",
        "candle light setup": "decoration",

        // Stage & Backdrop Setup
        "stage setup": "stage and backdrop setup",
        "stage decoration": "stage and backdrop setup",

        // DJ & Music
        "dj / music": "dj and music",
        "music / dj": "dj and music",

        // Audio & Lighting
        "light and sound": "audio and lighting",

        // Makeup & Hairstyling
        "makeup": "makeup and hairstyling",
        "bridal makeup": "makeup and hairstyling",
        "makeup artist": "makeup and hairstyling",

        // Wedding Wear & Jewellery
        "dress": "wedding wear and jewellery",
        "wedding dress": "wedding wear and jewellery",
        "saree / dress": "wedding wear and jewellery",
        "jewellery": "wedding wear and jewellery",

        // Entertainment & Performers
        "entertainment": "entertainment and performers",
        "magic show": "entertainment and performers",
        "mascot characters": "entertainment and performers",
        "surprise performers": "entertainment and performers",

        // Kids Entertainment & Toys
        "kids entertainment": "kids entertainment and toys",
        "giants toys": "kids entertainment and toys",

        // Cake & Desserts
        "cake": "cake and desserts",
        "birthday cake": "cake and desserts",
        "cake / sweets": "cake and desserts",

        // Invitation & Printing
        "invitation": "invitation and printing",
        "invitation printing": "invitation and printing",

        // Gifts & Return Gifts
        "return gifts": "gifts and return gifts",
        "gift delivery": "gifts and return gifts",
        "custom gifts": "gifts and return gifts",

        // Wedding Transport
        "wedding car": "wedding transport"
    };

    return aliases[key] || key;
}

function storedService(value){
 if(Array.isArray(value))return value.join(", ");
 const stored=String(value || "").trim();
 if(!stored)return "";

 const parts=stored.split(/\s*[—–]\s*/);
 return parts.length>=2
  ?parts.slice(1).join(" — ").trim()
  :stored;
}

function getEventCategories(){
 return BGC_EVENT_CATEGORIES.map(item=>({
  label:item[1],
  slug:item[2],
  emoji:item[0],
  canonical:canonicalCategory(item[1])
 }));
}

function providerCategory(provider){
 return storedService(
  provider.event_category ??
  provider.service_category ??
  provider.category ??
  ""
 );
}

function matchesEvent(provider,eventName){
 if(eventName==="All")return true;

 const cat=canonicalCategory(providerCategory(provider));
 if(!cat)return false;

 return getEventCategories().filter(item=>item.label===eventName).some(
  item=>item.canonical===cat
 );
}

function escapeHtml(value){
 return String(value ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function cleanPhone(value){
 return String(value || "").replace(/\D/g,"");
}

function getWhatsApp(value){
 let number=cleanPhone(value);
 if(number.length===10)number="91"+number;
 return number;
}

function providerUrl(provider){
 const category=providerCategory(provider) || "";
 const item=getEventCategories().find(
  x=>x.canonical===canonicalCategory(category)
 );
 const label=item ? item.label : category;
 const slug=item ? item.slug : category;
 return "bgc-event-providers.html?category="+encodeURIComponent(slug)
  +"&label="+encodeURIComponent(label);
}

function makeEventButtons(){
 eventTrack.innerHTML="";

 eventItems.forEach(item=>{
  const button=document.createElement("button");
  button.type="button";
  button.className="event-card"+(
   item.name===selectedEvent ? " active" : ""
  );
  button.setAttribute("aria-pressed",String(item.name===selectedEvent));
  button.textContent=item.name;

  button.addEventListener("click",()=>{
   selectedEvent=item.name;
   makeEventButtons();
   renderProviders();
  });

  eventTrack.appendChild(button);
 });
}

function firstValue(provider,keys){
 for(const key of keys){
  const value=provider[key];
  if(value!==undefined && value!==null && String(value).trim()!==""){
   return value;
  }
 }
 return "";
}

function createProviderCard(provider){
 const businessName=firstValue(provider,[
  "company_name","business_name","name","owner_name"
 ]) || "Event Service Provider";

 const category=providerCategory(provider) || "Event Service";
 const city=firstValue(provider,["city","area","location"]) || "Location not provided";
 const imageUrl=firstValue(provider,[
  "image_url","profile_image","business_image","photo_url","logo_url"
 ]);
 const rawPhone=firstValue(provider,[
  "whatsapp","whatsapp_number","phone","mobile","mobile_number"
 ]);
 const phone=getWhatsApp(rawPhone);
 const callPhone=cleanPhone(rawPhone);

 const card=document.createElement("article");
 card.className="provider-card";

 const photo=imageUrl
  ?'<img src="'+escapeHtml(imageUrl)+'" alt="'+escapeHtml(businessName)+'" loading="lazy" referrerpolicy="no-referrer">'
  :'<div class="photo-placeholder" aria-hidden="true">✦</div>';

 card.innerHTML=
  '<div class="provider-photo">'+photo+
   '<span class="category-chip">'+escapeHtml(category)+'</span>'+
  '</div>'+
  '<div class="provider-body">'+
   '<div class="provider-name">'+escapeHtml(businessName)+'</div>'+
   '<div class="provider-company">Registered service provider</div>'+
   '<div class="provider-city"><span>●</span><span>'+escapeHtml(city)+'</span></div>'+
   '<div class="provider-actions">'+
    (phone
     ?'<a class="action whatsapp" href="https://wa.me/'+escapeHtml(phone)+'" target="_blank" rel="noopener noreferrer">WhatsApp</a>'
     :'')+
    (callPhone
     ?'<a class="action view" href="tel:'+escapeHtml(callPhone)+'">☎ Call Now</a>'
     :'')+
   '</div>'+
  '</div>';

 const img=card.querySelector("img");
 if(img){
  img.addEventListener("error",()=>{
   const box=img.parentElement;
   img.remove();
   const fallback=document.createElement("div");
   fallback.className="photo-placeholder";
   fallback.textContent="✦";
   box.prepend(fallback);
  });
 }
 return card;
}

function renderProviders(){

 const query=normalize(searchInput.value);

 const matched=allProviders.filter(provider=>{

  if(!matchesEvent(provider,selectedEvent))return false;
  if(!query)return true;

  return normalize([
   provider.name,
   provider.company_name,
   provider.business_name,
   provider.event_category,
   provider.city,
   provider.category
  ].join(" ")).includes(query);
 });

 providerTrack.innerHTML="";
 emptyEl.hidden=true;
 providerTrack.hidden=true;
 statusEl.hidden=false;

 subtitleEl.textContent=selectedEvent==="All"
  ?"Explore trusted event professionals"
  :"Showing registered "+selectedEvent+" providers";

 const first=matched[0];

 if(first){
  viewAllEl.href=providerUrl(first);
 }else{
  viewAllEl.href="bgc-event-providers.html";
 }

 if(!matched.length){
  statusEl.hidden=true;
  emptyEl.textContent=query
   ?"No providers match your search."
   :"No registered providers found for "+selectedEvent+" yet.";
  emptyEl.hidden=false;
  return;
 }

 matched.forEach(provider=>{
  providerTrack.appendChild(createProviderCard(provider));
 });

 statusEl.hidden=true;
 providerTrack.hidden=false;
}

searchInput.addEventListener("input",renderProviders);

  /* SUPABASE PROVIDER LOADING */
async function loadProviders(){

 statusEl.hidden=false;
 emptyEl.hidden=true;
 providerTrack.hidden=true;
 statusEl.textContent="Loading registered providers...";

 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),15000);

 try{

  /*
   * select=* avoids failure caused by an incorrect column list.
   * Existing bgc_eventers table is used.
   */
  const url=SUPABASE_URL+
   "/rest/v1/bgc_eventers?select=*";

  const response=await fetch(url,{
   method:"GET",
   headers:{
    apikey:SUPABASE_KEY,
    Authorization:"Bearer "+SUPABASE_KEY,
    Accept:"application/json"
   },
   signal:controller.signal
  });

  const responseText=await response.text();

  if(!response.ok){
   let errorMessage=responseText;

   try{
    const errorData=JSON.parse(responseText);
    errorMessage=errorData.message ||
     errorData.details ||
     errorData.hint ||
     responseText;
   }catch(e){}

   throw new Error(
    "Supabase HTTP "+response.status+": "+errorMessage
   );
  }

  let data;

  try{
   data=JSON.parse(responseText);
  }catch(e){
   throw new Error("Supabase returned invalid JSON data.");
  }

  if(!Array.isArray(data)){
   throw new Error("Supabase response is not a provider list.");
  }

  allProviders=data;

  console.log("BGC EVENTS: Provider records loaded:",data.length);
  console.log("BGC EVENTS: Provider sample:",data[0] || "No records");

  if(data.length===0){
   statusEl.hidden=true;
   providerTrack.hidden=true;
   emptyEl.hidden=false;
   emptyEl.textContent=
    "No provider records returned from bgc_eventers. Check table data and Row Level Security (RLS).";
   return;
  }

  renderProviders();

 }catch(error){

  console.error("BGC EVENTS Supabase error:",error);

  statusEl.hidden=true;
  providerTrack.hidden=true;
  emptyEl.hidden=false;
  emptyEl.classList.add("error");

  if(error.name==="AbortError"){
   emptyEl.textContent=
    "Request timed out. Supabase did not respond within 15 seconds.";
  }else if(
   error instanceof TypeError
  ){
   emptyEl.textContent=
    "Network or CORS error. Check the Supabase URL, connection and browser console.";
  }else{
   emptyEl.textContent=error.message ||
    "Unable to load providers. Please check Supabase settings.";
  }

 }finally{
  clearTimeout(timeout);
 }
}

/* BACK BUTTON */
document.getElementById("backButton").addEventListener("click",()=>{
 if(window.history.length>1){
  window.history.back();
 }else{
  window.location.href="index.html";
 }
});

/* HIDDEN ADMIN ACCESS: TAP BGC EVENTS 5 TIMES */
(function(){

 const title=document.getElementById("adminTap");
 if(!title)return;

 let taps=0;
 let timer=null;

 title.addEventListener("click",()=>{

  taps++;
  clearTimeout(timer);

  timer=setTimeout(()=>{
   taps=0;
  },3000);

  if(taps>=5){
   taps=0;
   clearTimeout(timer);
   window.location.href="admin-events.html";
  }

 });

})();

makeEventButtons();
loadProviders();
